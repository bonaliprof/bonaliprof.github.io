<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carte des lieux de stage</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    async function initMap() {
      // Carte centrée sur Saint-Étienne
      const map = L.map('map').setView([45.4397, 4.3872], 12);

      // Fond de carte OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Couleurs par catégorie
      const couleurs = {
        informatique: "blue",
        electronique: "red",
        reseau: "green",
        autre: "purple"
      };

      // Chargement des données
      const response = await fetch("data/stages.json");
      const stages = await response.json();

      stages.forEach(stage => {
        const color = couleurs[stage.categorie] || "black";

        // Création d'un marqueur coloré
        const marker = L.circleMarker([stage.lat, stage.lng], {
          radius: 8,
          fillColor: color,
          color: "white",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`<b>${stage.nom}</b><br>${stage.categorie}`);
      });
    }

    initMap();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carte des lieux de stage</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    async function initMap() {

      const map = L.map('map').setView([45.4397, 4.3872], 11);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Chargement des deux JSON
      const geo = await fetch("data/stages_geocode.json").then(r => r.json());
      const full = await fetch("data/stages_full.json").then(r => r.json());

      // Couleurs par catégorie
      const couleurs = {
        "informatique": "#007bff",
        "electricite / electrotechnique": "#ff8c00",
        "electricite": "#ff8c00",
        "ciel": "#ff8c00",
        "telecom / fibre": "#e91e63",
        "electronique / robotique": "#9c27b0",
        "securite / courant faible": "#4caf50",
        "autre": "#9e9e9e"
      };


      geo.forEach(stage => {

        const info = full.find(e => e.nom === stage.nom);

        const marker = L.circleMarker([stage.lat, stage.lng], {
          radius: 8,
          fillColor: couleurs[stage.categorie] || couleurs["autre"],
          color: "white",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`
          <b>${info.nom}</b><br>
          ${info.activite || ""}<br><br>
          📍 ${info.adresse}, ${info.code_postal} ${info.ville}<br>
          📞 ${info.telephone || "Non renseigné"}<br>
          📧 ${info.email || "Non renseigné"}<br><br>
          👤 ${info.responsable_prenom || ""} ${info.responsable_nom || ""} (${info.responsable_fonction || ""})
        `);
      });
    }

    initMap();
  </script>
</body>
</html>

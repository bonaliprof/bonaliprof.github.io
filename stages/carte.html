<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des lieux de stage — BAC Pro CIEL</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    :root {
      --panel-bg: rgba(255, 255, 255, 0.96);
      --border: #d8dee4;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      left: 16px;
      top: 16px;
      width: min(380px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(8px);
    }

    .panel h1 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .panel .subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      background: white;
    }

    #searchInput:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .small-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button,
    .maps-link,
    .contact-link {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 0.82rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button:hover,
    .maps-link:hover,
    .contact-link:hover {
      background: #f3f4f6;
    }

    .legend-title {
      font-weight: 700;
      margin: 12px 0 8px;
      font-size: 0.92rem;
    }

    .special-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 12px;
      padding: 9px 10px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .special-filter input {
      accent-color: #2563eb;
    }

    .legend {
      display: grid;
      gap: 7px;
    }

    .legend label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .legend input {
      accent-color: #2563eb;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      flex: 0 0 auto;
    }

    #stats {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    #errorBox {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      font-size: 0.88rem;
    }

    .stage-popup {
      min-width: 250px;
      max-width: 310px;
    }

    .stage-popup h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      margin: 0 6px 10px 0;
      padding: 4px 8px;
      border-radius: 999px;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-stage {
      background: #2563eb;
    }

    .popup-line {
      margin: 5px 0;
      line-height: 1.35;
    }

    .popup-label {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 9px;
    }

    .popup-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }

    .leaflet-popup-content {
      margin: 14px;
    }


    .portal-link {
      position: absolute;
      z-index: 1001;
      right: 16px;
      top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(255,255,255,.96);
      color: #1f2937;
      border: 1px solid #d8dee4;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
      font-weight: 700;
      font-size: .9rem;
    }
    .portal-link:hover { background: #f3f4f6; }
    @media (max-width: 700px) { .portal-link { top: auto; bottom: 12px; right: 12px; } }

    @media (max-width: 700px) {
      .panel {
        left: 10px;
        top: 10px;
        width: calc(100vw - 20px);
        max-height: 45vh;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <a class="portal-link" href="../index.html">← Retour au portail</a>

  <aside class="panel" aria-label="Filtres de la carte">
    <h1>Carte des lieux de stage</h1>
    <p class="subtitle">Recherche par nom, ville, adresse, domaine ou activité.</p>

    <div class="search-row">
      <input id="searchInput" type="search" placeholder="Rechercher : Orange, Gardanne, fibre..." autocomplete="off" />
    </div>

    <div class="small-buttons">
      <button id="selectAll" type="button">Tout afficher</button>
      <button id="selectNone" type="button">Tout masquer</button>
      <button id="resetFilters" type="button">Réinitialiser</button>
    </div>

    <label class="special-filter" for="onlyStage2025">
      <input id="onlyStage2025" type="checkbox" />
      <span>Afficher uniquement les lieux de stage 2025-2026</span>
    </label>

    <div class="legend-title">Domaines affichés</div>
    <div id="legend" class="legend"></div>

    <div id="stats"></div>
    <div id="errorBox"></div>
  </aside>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const couleurs = {
      "informatique": "#007bff",
      "electricite / electrotechnique": "#ff8c00",
      "electricite": "#ff8c00",
      "ciel": "#ff8c00",
      "telecom / fibre": "#e91e63",
      "electronique / robotique": "#9c27b0",
      "securite / courant faible": "#4caf50",
      "audiovisuel / multimedia": "#795548",
      "autre": "#9e9e9e"
    };

    const labels = {
      "informatique": "Informatique",
      "electricite / electrotechnique": "Électricité / électrotechnique",
      "electricite": "Électricité",
      "ciel": "CIEL / polyvalent",
      "telecom / fibre": "Télécom / fibre",
      "electronique / robotique": "Électronique / robotique",
      "securite / courant faible": "Sécurité / courant faible",
      "audiovisuel / multimedia": "Audiovisuel / multimédia",
      "autre": "Autre"
    };

    const ordreCategories = [
      "informatique",
      "electricite / electrotechnique",
      "electricite",
      "ciel",
      "telecom / fibre",
      "electronique / robotique",
      "securite / courant faible",
      "audiovisuel / multimedia",
      "autre"
    ];

    const state = {
      markers: [],
      categories: new Set(),
      activeCategories: new Set(),
      query: "",
      onlyStage2025: false
    };

    const map = L.map('map').setView([43.4523, 5.4698], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function normalize(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function html(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.textContent = message;
    }

    async function loadJson(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`${path} introuvable (${response.status})`);
      }
      return response.json();
    }

    function findInfo(stage, full) {
      const stageName = normalize(stage.nom);
      const stageAddress = normalize(stage.adresse_complete);

      return full.find(item => {
        const itemName = normalize(item.nom);
        const itemAddress = normalize(`${item.adresse} ${item.code_postal} ${item.ville}`);
        return itemName === stageName && stageAddress.includes(itemAddress.slice(0, 18));
      }) || full.find(item => normalize(item.nom) === stageName) || {};
    }

    function buildPopup(stage, info) {
      const categorie = stage.categorie || "autre";
      const color = couleurs[categorie] || couleurs.autre;
      const label = labels[categorie] || categorie;
      const activite = info.activite_metier || "Activité non renseignée";
      const adresse = [info.adresse, info.code_postal, info.ville].filter(Boolean).join(', ') || stage.adresse_complete || "Adresse non renseignée";
      const responsable = [info.responsable_prenom, info.responsable_nom].filter(Boolean).join(' ');
      const fonction = info.responsable_fonction ? ` (${info.responsable_fonction})` : "";
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adresse)}`;
      const copyPayload = encodeURIComponent(adresse);

      const phone = info.telephone
        ? `<a class="contact-link" href="tel:${html(info.telephone.replaceAll(' ', ''))}">📞 Appeler</a>`
        : "";

      const email = info.email
        ? `<a class="contact-link" href="mailto:${html(info.email)}">📧 Email</a>`
        : "";

      const website = info.site_web
        ? `<a class="contact-link" href="${html(info.site_web.startsWith('http') ? info.site_web : 'https://' + info.site_web)}" target="_blank" rel="noopener">🌐 Site</a>`
        : "";

      const stageBadge = stage.lieu_stage_2025_2026 || info.lieu_stage_2025_2026
        ? '<span class="badge badge-stage">Stage 2025-2026</span>'
        : '';

      return `
        <div class="stage-popup">
          <h2>${html(info.nom || stage.nom)}</h2>
          <span class="badge" style="background:${html(color)}">${html(label)}</span>${stageBadge}

          <div class="popup-label">Activité</div>
          <div class="popup-line">${html(activite)}</div>

          <div class="popup-label">Adresse</div>
          <div class="popup-line">📍 ${html(adresse)}</div>

          <div class="popup-label">Contact</div>
          <div class="popup-line">${info.telephone ? `📞 ${html(info.telephone)}` : 'Téléphone non renseigné'}</div>
          <div class="popup-line">${info.email ? `📧 ${html(info.email)}` : 'Email non renseigné'}</div>

          <div class="popup-label">Responsable</div>
          <div class="popup-line">${responsable ? `👤 ${html(responsable + fonction)}` : 'Non renseigné'}</div>

          <div class="popup-actions">
            <a class="maps-link" href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a>
            <button type="button" onclick="copyAddress('${copyPayload}')">📋 Copier adresse</button>
            ${phone}
            ${email}
            ${website}
          </div>
        </div>
      `;
    }

    window.copyAddress = async function(encodedAddress) {
      const address = decodeURIComponent(encodedAddress);
      try {
        await navigator.clipboard.writeText(address);
      } catch (error) {
        const temp = document.createElement('textarea');
        temp.value = address;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
    };

    function createLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = "";

      const sortedCategories = [...state.categories].sort((a, b) => {
        const ia = ordreCategories.indexOf(a);
        const ib = ordreCategories.indexOf(b);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
      });

      for (const categorie of sortedCategories) {
        const id = `cat-${normalize(categorie).replaceAll(' ', '-')}`;
        const label = document.createElement('label');
        label.setAttribute('for', id);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = id;
        checkbox.value = categorie;
        checkbox.checked = true;
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            state.activeCategories.add(categorie);
          } else {
            state.activeCategories.delete(categorie);
          }
          applyFilters();
        });

        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.backgroundColor = couleurs[categorie] || couleurs.autre;

        const text = document.createElement('span');
        text.textContent = labels[categorie] || categorie;

        label.append(checkbox, dot, text);
        legend.appendChild(label);
      }
    }

    function markerMatches(markerData) {
      const categoryOk = state.activeCategories.has(markerData.categorie);
      if (!categoryOk) return false;

      if (state.onlyStage2025 && !markerData.lieuStage2025) return false;

      if (!state.query) return true;
      return markerData.searchText.includes(state.query);
    }

    function applyFilters() {
      let visibleCount = 0;
      const bounds = [];

      for (const markerData of state.markers) {
        const visible = markerMatches(markerData);
        if (visible) {
          if (!map.hasLayer(markerData.marker)) markerData.marker.addTo(map);
          visibleCount++;
          bounds.push(markerData.marker.getLatLng());
        } else if (map.hasLayer(markerData.marker)) {
          map.removeLayer(markerData.marker);
        }
      }

      const total2025 = state.markers.filter(item => item.lieuStage2025).length;
      const suffix = state.onlyStage2025 ? ` · ${total2025} lieu(x) 2025-2026 géocodé(s)` : ` · ${total2025} lieu(x) 2025-2026 géocodé(s)`;
      document.getElementById('stats').textContent = `${visibleCount} lieu(x) affiché(s) sur ${state.markers.length}${suffix}`;
    }

    function setAllCategories(checked) {
      state.activeCategories = checked ? new Set(state.categories) : new Set();
      document.querySelectorAll('#legend input[type="checkbox"]').forEach(input => {
        input.checked = checked;
      });
      applyFilters();
    }

    async function initMap() {
      try {
        const geo = await loadJson('./stages_geocode.json');
        const full = await loadJson('./stages_full.json');

        for (const stage of geo) {
          const info = findInfo(stage, full);
          const categorie = stage.categorie || "autre";
          state.categories.add(categorie);
          state.activeCategories.add(categorie);

          const marker = L.circleMarker([stage.lat, stage.lng], {
            radius: 8,
            fillColor: couleurs[categorie] || couleurs.autre,
            color: "white",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.92
          }).bindPopup(buildPopup(stage, info));

          const searchText = normalize([
            stage.nom,
            stage.categorie,
            stage.adresse_complete,
            info.nom,
            info.activite_metier,
            info.adresse,
            info.code_postal,
            info.ville,
            info.telephone,
            info.email,
            info.responsable_nom,
            info.responsable_prenom
          ].filter(Boolean).join(' '));

          const lieuStage2025 = Boolean(stage.lieu_stage_2025_2026 || info.lieu_stage_2025_2026);
          state.markers.push({ marker, categorie, searchText, lieuStage2025 });
        }

        createLegend();
        applyFilters();

        const group = L.featureGroup(state.markers.map(item => item.marker));
        if (state.markers.length) {
          map.fitBounds(group.getBounds().pad(0.1));
        }

        document.getElementById('searchInput').addEventListener('input', event => {
          state.query = normalize(event.target.value);
          applyFilters();
        });

        document.getElementById('onlyStage2025').addEventListener('change', event => {
          state.onlyStage2025 = event.target.checked;
          applyFilters();
        });

        document.getElementById('selectAll').addEventListener('click', () => setAllCategories(true));
        document.getElementById('selectNone').addEventListener('click', () => setAllCategories(false));
        document.getElementById('resetFilters').addEventListener('click', () => {
          document.getElementById('searchInput').value = "";
          document.getElementById('onlyStage2025').checked = false;
          state.query = "";
          state.onlyStage2025 = false;
          setAllCategories(true);
        });
      } catch (error) {
        console.error(error);
        showError(`Impossible de charger la carte : ${error.message}`);
      }
    }

    initMap();
  </script>
</body>
</html>
